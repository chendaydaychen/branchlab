services:
  postgres:
    image: postgres:16
    container_name: branchlab-postgres
    environment:
      POSTGRES_USER: branchlab
      POSTGRES_PASSWORD: branchlab
      POSTGRES_DB: branchlab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchlab -d branchlab"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
